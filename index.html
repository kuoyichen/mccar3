<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ArUco 三軸角度辨識</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121923;
      --panel2: #17212e;
      --text: #eef4fb;
      --muted: #9caec2;
      --green: #35e27a;
      --red: #ff6b6b;
      --border: #263446;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", "PingFang TC", sans-serif;
      background:
        radial-gradient(circle at top, #162031 0, #0b0f14 42%),
        var(--bg);
      color: var(--text);
    }
    .wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 4vw, 40px);
      letter-spacing: .02em;
    }
    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, .85fr);
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .wrap { padding: 12px; }
    }
    .card {
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 14px 40px rgba(0,0,0,.28);
      overflow: hidden;
    }
    .viewer {
      padding: 12px;
    }
    .canvas-shell {
      position: relative;
      min-height: 260px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 13px;
      background:
        linear-gradient(45deg, #101721 25%, transparent 25%) 0 0/24px 24px,
        linear-gradient(45deg, transparent 75%, #101721 75%) 0 0/24px 24px,
        linear-gradient(45deg, transparent 75%, #101721 75%) 12px -12px/24px 24px,
        linear-gradient(45deg, #101721 25%, #0b1017 25%) 12px 12px/24px 24px;
      border: 1px solid #202d3d;
    }
    #view {
      display: block;
      max-width: 100%;
      max-height: 76vh;
      width: auto;
      height: auto;
    }
    .hint {
      position: absolute;
      inset: auto 12px 12px 12px;
      padding: 9px 11px;
      border-radius: 10px;
      background: rgba(0,0,0,.56);
      color: #d7e1ec;
      font-size: 13px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding: 12px 0 0;
    }
    button, .file-label {
      appearance: none;
      border: 1px solid #34475e;
      background: #172333;
      color: var(--text);
      border-radius: 11px;
      padding: 10px 13px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: .15s ease;
    }
    button:hover, .file-label:hover {
      transform: translateY(-1px);
      border-color: #4e6888;
      background: #1d2c3f;
    }
    button.primary {
      background: #0e6d3b;
      border-color: #169c57;
    }
    button.danger {
      background: #462226;
      border-color: #6f343c;
    }
    input[type=file] { display: none; }
    .side {
      padding: 16px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      color: var(--muted);
      min-height: 24px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #7f8c9b;
      box-shadow: 0 0 0 4px rgba(127,140,155,.12);
      flex: 0 0 auto;
    }
    .dot.ok {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(53,226,122,.12);
    }
    .dot.bad {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(255,107,107,.12);
    }
    .angles {
      display: grid;
      gap: 9px;
      margin: 14px 0;
    }
    .metric {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: baseline;
      padding: 12px 13px;
      border-radius: 12px;
      background: var(--panel2);
      border: 1px solid #25354a;
    }
    .metric span {
      color: var(--muted);
      font-size: 14px;
    }
    .metric strong {
      font-variant-numeric: tabular-nums;
      font-size: 24px;
    }
    .small-metric strong { font-size: 17px; }
    .settings {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: grid;
      gap: 10px;
    }
    .field {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }
    input[type=number] {
      width: 100%;
      color: var(--text);
      background: #0d141d;
      border: 1px solid #34475e;
      border-radius: 9px;
      padding: 9px 10px;
      font: inherit;
    }
    .note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    code {
      background: #0b1119;
      border: 1px solid #233145;
      border-radius: 6px;
      padding: 1px 5px;
      color: #bfe8ce;
    }
  </style>

  <!-- js-aruco2：辨識 + POSIT 姿態估計 -->
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/svd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/posit1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/cv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js"></script>
</head>
<body>
  <main class="wrap">
    <h1>ArUco 三軸角度辨識</h1>
    <p class="subtitle">
      針對你提供的 5×5 ArUco 圖樣（ID 0）辨識。偵測成功後以綠框標出，
      並顯示 Roll(X)、Pitch(Y)、Yaw(Z)。
    </p>

    <div class="grid">
      <section class="card viewer">
        <div class="canvas-shell">
          <canvas id="view" width="640" height="480"></canvas>
          <div class="hint" id="hint">可先按「測試這張 ArUco」，或開啟相機。</div>
        </div>

        <div class="toolbar">
          <button class="primary" id="cameraBtn">開啟相機</button>
          <button class="danger" id="stopBtn">停止相機</button>
          <button id="testBtn">測試這張 ArUco</button>
          <label class="file-label" for="fileInput">上傳圖片</label>
          <input id="fileInput" type="file" accept="image/*" />
        </div>
      </section>

      <aside class="card side">
        <div class="status">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">等待影像</span>
        </div>

        <div class="metric small-metric">
          <span>Marker ID</span>
          <strong id="markerId">—</strong>
        </div>

        <div class="angles">
          <div class="metric">
            <span>Roll · X 軸</span>
            <strong id="roll">—</strong>
          </div>
          <div class="metric">
            <span>Pitch · Y 軸</span>
            <strong id="pitch">—</strong>
          </div>
          <div class="metric">
            <span>Yaw · Z 軸</span>
            <strong id="yaw">—</strong>
          </div>
        </div>

        <div class="metric small-metric">
          <span>重投影誤差</span>
          <strong id="poseError">—</strong>
        </div>

        <div class="settings">
          <label class="field">
            <span>Marker 實際邊長（mm）</span>
            <input id="markerSize" type="number" value="50" min="1" step="1" />
          </label>
          <label class="field">
            <span>相機水平 FOV（°）</span>
            <input id="fov" type="number" value="60" min="20" max="140" step="1" />
          </label>
        </div>

        <p class="note">
          三軸角度採 ZYX Euler 分解：Roll=X、Pitch=Y、Yaw=Z。
          FOV 越接近你的實際鏡頭，角度估計越穩定。相機功能通常需要
          <code>HTTPS</code> 或 <code>localhost</code>。
        </p>
      </aside>
    </div>
  </main>

  <video id="video" playsinline autoplay muted hidden></video>
  <canvas id="raw" hidden></canvas>
  <canvas id="detect" hidden></canvas>

<script>
(() => {
  "use strict";

  const view = document.getElementById("view");
  const vctx = view.getContext("2d");

  const raw = document.getElementById("raw");
  const rctx = raw.getContext("2d", { willReadFrequently: true });

  const detectCanvas = document.getElementById("detect");
  const dctx = detectCanvas.getContext("2d", { willReadFrequently: true });

  const video = document.getElementById("video");
  const cameraBtn = document.getElementById("cameraBtn");
  const stopBtn = document.getElementById("stopBtn");
  const testBtn = document.getElementById("testBtn");
  const fileInput = document.getElementById("fileInput");

  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const markerIdEl = document.getElementById("markerId");
  const rollEl = document.getElementById("roll");
  const pitchEl = document.getElementById("pitch");
  const yawEl = document.getElementById("yaw");
  const poseErrorEl = document.getElementById("poseError");
  const markerSizeEl = document.getElementById("markerSize");
  const fovEl = document.getElementById("fov");
  const hint = document.getElementById("hint");

  const PAD = 24;
  const MAX_W = 960;
  const MAX_H = 720;
  const RAD2DEG = 180 / Math.PI;

  let detector = null;
  let stream = null;
  let cameraLoop = 0;
  let lastAngles = null;
  let missFrames = 0;

  // 你提供的圖樣之 5×5 payload：
  // 10100
  // 01011
  // 01100
  // 10101
  // 11100
  // row-major = 0x145b2bc
  const TARGET_DICT = "OPENCV_5X5_ID0";

  function initDetector() {
    if (!window.AR || !window.CV || !window.POS || !window.SVD) {
      setStatus("辨識函式庫載入失敗，請確認網路連線", "bad");
      return false;
    }

    AR.DICTIONARIES[TARGET_DICT] = {
      nBits: 25,
      tau: 3,             // 接受 Hamming distance 0~2
      codeList: ["0x145b2bc"]
    };

    detector = new AR.Detector({
      dictionaryName: TARGET_DICT,
      maxHammingDistance: 3
    });
    return true;
  }

  function setStatus(text, type = "") {
    statusText.textContent = text;
    statusDot.className = "dot" + (type ? " " + type : "");
  }

  function clearReadout() {
    markerIdEl.textContent = "—";
    rollEl.textContent = "—";
    pitchEl.textContent = "—";
    yawEl.textContent = "—";
    poseErrorEl.textContent = "—";
  }

  function setCanvasSize(sourceW, sourceH) {
    const scale = Math.min(1, MAX_W / sourceW, MAX_H / sourceH);
    const w = Math.max(1, Math.round(sourceW * scale));
    const h = Math.max(1, Math.round(sourceH * scale));

    if (raw.width !== w || raw.height !== h) {
      raw.width = w;
      raw.height = h;
      view.width = w;
      view.height = h;
      detectCanvas.width = w + PAD * 2;
      detectCanvas.height = h + PAD * 2;
      lastAngles = null;
    }
    return { w, h };
  }

  function processRawFrame() {
    if (!detector && !initDetector()) return;

    // 偵測用影像外加白邊：即使 ArUco 剛好貼齊圖片邊緣，也比較容易抓到外框。
    dctx.fillStyle = "#fff";
    dctx.fillRect(0, 0, detectCanvas.width, detectCanvas.height);
    dctx.drawImage(raw, PAD, PAD);

    let markers = [];
    try {
      const imageData = dctx.getImageData(0, 0, detectCanvas.width, detectCanvas.height);
      markers = detector.detect(imageData);
    } catch (err) {
      console.error(err);
      setStatus("辨識時發生錯誤：" + err.message, "bad");
      return;
    }

    // 先畫原始畫面，再疊加綠框。
    vctx.clearRect(0, 0, view.width, view.height);
    vctx.drawImage(raw, 0, 0);

    if (!markers.length) {
      missFrames++;
      if (missFrames > 8) lastAngles = null;
      clearReadout();
      setStatus("未偵測到指定 ArUco", "");
      return;
    }

    missFrames = 0;

    // 這份頁面只針對單一目標 marker，因此取第一個。
    const marker = markers[0];
    const corners = marker.corners.map(p => ({ x: p.x - PAD, y: p.y - PAD }));

    const poseResult = estimatePose(corners);
    drawMarkerOverlay(corners, marker, poseResult);

    markerIdEl.textContent = String(marker.id);
    setStatus("已辨識到 ArUco", "ok");

    if (poseResult) {
      const { roll, pitch, yaw, error } = poseResult;
      rollEl.textContent = roll.toFixed(1) + "°";
      pitchEl.textContent = pitch.toFixed(1) + "°";
      yawEl.textContent = yaw.toFixed(1) + "°";
      poseErrorEl.textContent = Number.isFinite(error) ? error.toFixed(1) + " px" : "—";
    }
  }

  function estimatePose(corners) {
    try {
      const markerSize = Math.max(1, Number(markerSizeEl.value) || 50);
      const hfovDeg = Math.min(140, Math.max(20, Number(fovEl.value) || 60));
      const focal = view.width / (2 * Math.tan((hfovDeg * Math.PI / 180) / 2));

      const centered = corners.map(p => ({
        x: p.x - view.width / 2,
        y: view.height / 2 - p.y
      }));

      const posit = new POS.Posit(markerSize, focal);
      const pose = posit.pose(centered);
      if (!pose || !pose.bestRotation) return null;

      let angles = rotationToEulerZYX(pose.bestRotation);
      angles = smoothEuler(angles, 0.24);

      return {
        ...angles,
        error: Number(pose.bestError)
      };
    } catch (err) {
      console.error("Pose error:", err);
      return null;
    }
  }

  // R = Rz(yaw) * Ry(pitch) * Rx(roll)
  function rotationToEulerZYX(R) {
    const sy = Math.hypot(R[0][0], R[1][0]);
    const singular = sy < 1e-6;

    let roll, pitch, yaw;

    if (!singular) {
      roll = Math.atan2(R[2][1], R[2][2]);
      pitch = Math.atan2(-R[2][0], sy);
      yaw = Math.atan2(R[1][0], R[0][0]);
    } else {
      roll = Math.atan2(-R[1][2], R[1][1]);
      pitch = Math.atan2(-R[2][0], sy);
      yaw = 0;
    }

    return {
      roll: normalizeDeg(roll * RAD2DEG),
      pitch: normalizeDeg(pitch * RAD2DEG),
      yaw: normalizeDeg(yaw * RAD2DEG)
    };
  }

  function normalizeDeg(v) {
    while (v > 180) v -= 360;
    while (v <= -180) v += 360;
    return v;
  }

  function smoothOne(prev, next, alpha) {
    if (!Number.isFinite(prev)) return next;
    let delta = normalizeDeg(next - prev);
    return normalizeDeg(prev + delta * alpha);
  }

  function smoothEuler(next, alpha) {
    if (!lastAngles) {
      lastAngles = { ...next };
      return next;
    }
    lastAngles = {
      roll: smoothOne(lastAngles.roll, next.roll, alpha),
      pitch: smoothOne(lastAngles.pitch, next.pitch, alpha),
      yaw: smoothOne(lastAngles.yaw, next.yaw, alpha)
    };
    return { ...lastAngles };
  }

  function drawMarkerOverlay(corners, marker, poseResult) {
    if (!corners.length) return;

    vctx.save();

    // 綠框
    vctx.strokeStyle = "#35e27a";
    vctx.lineWidth = Math.max(3, view.width / 260);
    vctx.lineJoin = "round";
    vctx.beginPath();
    vctx.moveTo(corners[0].x, corners[0].y);
    for (let i = 1; i < corners.length; i++) {
      vctx.lineTo(corners[i].x, corners[i].y);
    }
    vctx.closePath();
    vctx.stroke();

    // 四角點
    vctx.fillStyle = "#35e27a";
    for (const p of corners) {
      vctx.beginPath();
      vctx.arc(p.x, p.y, Math.max(3, view.width / 220), 0, Math.PI * 2);
      vctx.fill();
    }

    // 資訊標籤
    let text = "ID " + marker.id;
    if (poseResult) {
      text += `  X ${poseResult.roll.toFixed(1)}°  Y ${poseResult.pitch.toFixed(1)}°  Z ${poseResult.yaw.toFixed(1)}°`;
    }

    const fontSize = Math.max(14, Math.min(26, view.width / 32));
    vctx.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    const pad = Math.round(fontSize * 0.45);
    const metrics = vctx.measureText(text);
    const boxW = metrics.width + pad * 2;
    const boxH = fontSize + pad * 1.5;

    const minX = Math.min(...corners.map(p => p.x));
    const minY = Math.min(...corners.map(p => p.y));
    const x = Math.max(4, Math.min(view.width - boxW - 4, minX));
    const y = Math.max(boxH + 4, minY - 8);

    vctx.fillStyle = "rgba(0,0,0,.72)";
    roundRect(vctx, x, y - boxH, boxW, boxH, 8);
    vctx.fill();

    vctx.fillStyle = "#68f09a";
    vctx.textBaseline = "middle";
    vctx.fillText(text, x + pad, y - boxH / 2);

    vctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  async function startCamera() {
    stopCamera();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("此瀏覽器不支援相機 API", "bad");
      return;
    }

    try {
      setStatus("正在取得相機權限…", "");
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      hint.style.display = "none";
      setStatus("相機已開啟，請將 ArUco 放入畫面", "");
      lastAngles = null;

      const tick = () => {
        if (!stream) return;
        if (video.readyState >= 2 && video.videoWidth && video.videoHeight) {
          const { w, h } = setCanvasSize(video.videoWidth, video.videoHeight);
          rctx.clearRect(0, 0, w, h);
          rctx.drawImage(video, 0, 0, w, h);
          processRawFrame();
        }
        cameraLoop = requestAnimationFrame(tick);
      };
      tick();
    } catch (err) {
      console.error(err);
      let msg = "無法開啟相機";
      if (!window.isSecureContext) {
        msg += "；請用 HTTPS 或 localhost 開啟此頁";
      } else if (err && err.message) {
        msg += "：" + err.message;
      }
      setStatus(msg, "bad");
    }
  }

  function stopCamera() {
    if (cameraLoop) {
      cancelAnimationFrame(cameraLoop);
      cameraLoop = 0;
    }
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;
  }

  function loadImage(src) {
    stopCamera();
    const img = new Image();
    img.onload = () => {
      const { w, h } = setCanvasSize(img.naturalWidth, img.naturalHeight);
      rctx.fillStyle = "#fff";
      rctx.fillRect(0, 0, w, h);
      rctx.drawImage(img, 0, 0, w, h);
      hint.style.display = "none";
      lastAngles = null;
      processRawFrame();
    };
    img.onerror = () => setStatus("圖片載入失敗", "bad");
    img.src = src;
  }

  cameraBtn.addEventListener("click", startCamera);
  stopBtn.addEventListener("click", () => {
    stopCamera();
    setStatus("相機已停止", "");

  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    stopCamera();
    const img = new Image();
    img.onload = () => {
      const { w, h } = setCanvasSize(img.naturalWidth, img.naturalHeight);
      rctx.drawImage(img, 0, 0, w, h);
      hint.style.display = "none";
      lastAngles = null;
      processRawFrame();
      URL.revokeObjectURL(url);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      setStatus("圖片載入失敗", "bad");
    };
    img.src = url;
  });

  markerSizeEl.addEventListener("change", () => { lastAngles = null; });
  fovEl.addEventListener("change", () => { lastAngles = null; });

  // 初始畫面
  vctx.fillStyle = "#0c121a";
  vctx.fillRect(0, 0, view.width, view.height);
  vctx.fillStyle = "#7f92a8";
  vctx.textAlign = "center";
  vctx.textBaseline = "middle";
  vctx.font = "600 20px system-ui, sans-serif";
  vctx.fillText("ArUco 5×5 · ID 0", view.width / 2, view.height / 2);

  window.addEventListener("beforeunload", stopCamera);
})();
