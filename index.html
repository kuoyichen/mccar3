<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Micro:bit AI 視覺自駕控制器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            overscroll-behavior-y: contain;
            touch-action: none;
            background-color: #0b0f0c;
            color: #e6f0e8;
            font-family: "IBM Plex Sans TC", system-ui, sans-serif;
        }
        
        /* Joystick Styles */
        .joystick-container {
            position: relative;
            width: 120px;
            height: 120px;
            background-color: #233127;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            border: 2px solid #1a231d;
        }
        .joystick-knob {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #22e07a;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .joystick-knob:active { background-color: #1bb562; }

        /* Camera Stage Styles */
        .stage {
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #233127;
            border-radius: 0.5rem;
            aspect-ratio: 4/3;
            width: 100%;
            max-height: 50vh;
            cursor: crosshair;
        }
        .stage video, .stage canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #overlay { pointer-events: none; z-index: 10; }
        
        /* Custom UI Elements */
        .panel { background: #121814; border: 1px solid #233127; }
        .data-readout { font-family: "IBM Plex Mono", monospace; }
        
        /* Fullscreen Stage */
        .stage-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-height: none !important;
            z-index: 9999 !important;
            border-radius: 0 !important;
            border: none !important;
            aspect-ratio: auto !important;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f0c; }
        ::-webkit-scrollbar-thumb { background: #233127; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-gray-900 border-b border-green-900/50 text-white p-3 shadow-md flex flex-wrap justify-between items-center gap-2 z-20 relative">
        <div>
            <h1 class="text-lg font-bold tracking-wide text-green-400">Micro:bit 視覺自駕</h1>
            <div id="cvStatus" class="text-xs text-gray-400 font-mono flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-yellow-500 inline-block animate-pulse" id="cvDot"></span>
                載入 OpenCV.js...
            </div>
        </div>
        <div class="flex gap-2">
            <button id="btnCam" class="bg-gray-800 border border-gray-600 text-gray-200 px-3 py-1.5 rounded text-sm hover:bg-gray-700 transition">
                啟動相機
            </button>
            <button id="connectBtn" class="bg-blue-600/20 border border-blue-500 text-blue-400 px-4 py-1.5 rounded font-semibold hover:bg-blue-600/30 transition shadow">
                連接藍牙
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Left: Camera & Auto Control -->
        <div class="flex-1 flex flex-col p-2 gap-2 overflow-y-auto">
            <!-- Camera Stage -->
            <div class="stage" id="stageContainer">
                <button id="btnExitFullscreen" class="hidden absolute top-2 left-2 bg-gray-800/80 border border-gray-500 text-white px-3 py-1 rounded text-sm z-30 hover:bg-gray-700 transition cursor-pointer">離開全螢幕</button>
                <div class="absolute top-2 right-2 flex gap-2 z-30">
                    <button id="btnAutoStartOverlay" disabled class="bg-green-600/80 border border-green-500 text-white px-3 py-1 rounded text-sm opacity-50 cursor-not-allowed transition hover:bg-green-500 disabled:hover:bg-green-600/80 cursor-pointer shadow-lg shadow-black/50">開始</button>
                    <button id="btnAutoStopOverlay" disabled class="bg-red-600/80 border border-red-500 text-white px-3 py-1 rounded text-sm opacity-50 cursor-not-allowed transition hover:bg-red-500 disabled:hover:bg-red-600/80 cursor-pointer shadow-lg shadow-black/50">停止</button>
                </div>
                <video id="video" playsinline muted></video>
                <canvas id="overlay"></canvas>
                <div class="absolute bottom-2 left-2 text-xs text-gray-300 bg-black/60 px-2 py-1 rounded font-mono border border-gray-700 pointer-events-none" id="btStatus">
                    藍牙未連線
                </div>
            </div>

            <!-- Auto Control Panel -->
            <div class="panel rounded-lg p-3 flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-green-400 font-semibold text-sm">自動導航控制</h2>
                    <span id="targetStatus" class="text-xs text-gray-400">連續點擊畫面可建立多點路徑</span>
                </div>
                
                <div class="grid grid-cols-4 gap-1.5">
                    <button id="btnAutoStart" disabled class="min-w-0 whitespace-nowrap bg-green-600/20 border border-green-500 text-green-400 py-2 rounded font-medium opacity-50 cursor-not-allowed transition hover:bg-green-600/30 disabled:hover:bg-green-600/20 text-xs px-1">
                        開始
                    </button>
                    <button id="btnAutoStop" disabled class="min-w-0 whitespace-nowrap bg-red-600/20 border border-red-500 text-red-400 py-2 rounded font-medium opacity-50 cursor-not-allowed transition hover:bg-red-600/30 disabled:hover:bg-red-600/20 text-xs px-1">
                        停止
                    </button>
                    <button id="btnAutoScanRoute" disabled class="min-w-0 whitespace-nowrap bg-cyan-600/15 border border-cyan-600 text-cyan-300 py-2 rounded font-medium opacity-50 cursor-not-allowed transition hover:bg-cyan-600/25 text-xs px-1">
                        自動掃描
                    </button>
                    <button id="btnViewHistory" class="min-w-0 whitespace-nowrap bg-blue-600/20 border border-blue-500 text-blue-400 py-2 rounded font-medium transition hover:bg-blue-600/30 text-xs px-1">
                        觀看歷程
                    </button>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <button id="btnUndoWaypoint" disabled class="min-w-0 whitespace-nowrap bg-yellow-600/10 border border-yellow-700/70 text-yellow-400 py-1.5 px-1 rounded text-xs opacity-50 cursor-not-allowed transition hover:bg-yellow-600/20">復原上一點</button>
                    <button id="btnFullscreen" class="min-w-0 whitespace-nowrap bg-gray-700/30 border border-gray-600 text-gray-200 py-1.5 px-1 rounded text-xs transition hover:bg-gray-700/50 cursor-pointer">相機全螢幕</button>
                    <button id="btnClearRoute" disabled class="min-w-0 whitespace-nowrap bg-red-600/10 border border-red-800 text-red-400 py-1.5 px-1 rounded text-xs opacity-50 cursor-not-allowed transition hover:bg-red-600/20">清除路徑</button>
                </div>
                
                <div class="text-xs text-gray-400 bg-black/30 p-2 rounded data-readout flex justify-between gap-2 flex-wrap">
                    <div>輸出字串: <span id="debugString" class="text-green-300">SRV1500150015001500#</span></div>
                    <div>模式: <span id="modeDisplay" class="text-blue-300">手動</span></div>
                </div>

                <!-- 視覺辨識來源切換：ArUco+LED / ArUco / LED -->
                <div class="border-t border-gray-800 pt-3 flex flex-col gap-2">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-gray-400">方向辨識來源</span>
                        <span id="visionModeStatus" class="text-green-300 data-readout">僅 ArUco</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button id="btnVisionBoth" class="vision-mode-btn bg-gray-900 border border-gray-700 text-gray-400 py-1.5 px-2 rounded text-xs font-medium transition hover:border-cyan-500">ArUco + LED</button>
                        <button id="btnVisionAruco" class="vision-mode-btn bg-green-600/20 border border-green-500 text-green-300 py-1.5 px-2 rounded text-xs font-medium transition">僅 ArUco</button>
                        <button id="btnVisionLed" class="vision-mode-btn bg-gray-900 border border-gray-700 text-gray-400 py-1.5 px-2 rounded text-xs font-medium transition hover:border-red-500">僅 LED</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs data-readout bg-black/30 p-2 rounded border border-gray-800">
                        <div>LED: <b id="ledStatus" class="text-gray-500">等待相機</b></div>
                        <div class="text-right">方向: <b id="ledAngle" class="text-orange-300">—</b></div>
                    </div>
                    <div class="flex items-center gap-3 text-[11px] text-gray-500">
                        <label>紅光門檻 <input id="ledRThreshold" type="number" min="80" max="250" value="140" class="w-14 bg-black border border-gray-700 text-center rounded ml-1"></label>
                        <label>色差 <input id="ledDominance" type="number" min="10" max="120" value="30" class="w-14 bg-black border border-gray-700 text-center rounded ml-1"></label>
                    </div>

                    <div class="mt-1 bg-black/30 border border-orange-900/50 rounded p-2 flex flex-col gap-2">
                        <div class="flex justify-between items-center text-[11px]">
                            <span class="text-orange-300 font-semibold">ArUco 搜尋設定</span>
                            <span class="text-gray-500">遺失時才生效</span>
                        </div>
                        <label class="grid grid-cols-[72px_1fr_48px] gap-2 items-center text-[11px] text-gray-400">
                            <span>搜尋油門</span>
                            <input id="recoveryThrottle" type="range" min="1510" max="1700" step="5" value="1570" class="w-full accent-orange-500">
                            <b id="recoveryThrottleOut" class="text-orange-300 text-right data-readout">1570</b>
                        </label>
                        <label class="grid grid-cols-[72px_1fr_48px] gap-2 items-center text-[11px] text-gray-400">
                            <span>轉向幅度</span>
                            <input id="recoverySteer" type="range" min="20" max="350" step="10" value="120" class="w-full accent-orange-500">
                            <b id="recoverySteerOut" class="text-orange-300 text-right data-readout">±120</b>
                        </label>
                        <label class="grid grid-cols-[72px_1fr_48px] gap-2 items-center text-[11px] text-gray-400">
                            <span>搜尋時間</span>
                            <input id="recoveryTime" type="range" min="1" max="15" step="0.5" value="4.5" class="w-full accent-orange-500">
                            <b id="recoveryTimeOut" class="text-orange-300 text-right data-readout">4.5s</b>
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- ArUco Data (Hidden on small screens to save space, but kept for full functionality) -->
            <div class="panel rounded-lg p-3 hidden sm:flex flex-col gap-2 text-xs data-readout text-gray-400">
                <div class="flex justify-between"><span>ArUco ID: <b id="idOut" class="text-green-400 text-sm">—</b></span> <span id="vd">—</span></div>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-black/30 p-1 rounded border border-gray-800">Roll(X)<br><b id="vx" class="text-red-400">—</b></div>
                    <div class="bg-black/30 p-1 rounded border border-gray-800">Pitch(Y)<br><b id="vy" class="text-green-400">—</b></div>
                    <div class="bg-black/30 p-1 rounded border border-gray-800">Yaw(Z)<br><b id="vz" class="text-blue-400">—</b></div>
                </div>
                <div class="text-gray-500 mt-1">設定: FOV <input type="number" id="fov" value="60" class="w-12 bg-black border border-gray-700 text-center rounded ml-1">°, 尺寸 <input type="number" id="msize" value="50" class="w-12 bg-black border border-gray-700 text-center rounded ml-1">mm</div>
            </div>
        </div>

        <!-- Right: Manual Joysticks -->
        <div class="w-full md:w-80 panel md:border-l md:border-t-0 border-t border-green-900/50 p-4 flex flex-row md:flex-col justify-around items-center gap-6 z-10">
            <!-- 左搖桿 (上下油門) -->
            <div class="flex flex-col items-center">
                <span class="mb-3 font-semibold text-gray-400 text-sm">左手 (油門前後)</span>
                <div id="leftJoystick" class="joystick-container">
                    <div id="leftKnob" class="joystick-knob"></div>
                </div>
                <div class="mt-3 text-sm text-green-400 data-readout bg-black/40 px-3 py-1 rounded border border-gray-800" id="leftValDisplay">1500</div>
            </div>

            <!-- 右搖桿 (左右方向) -->
            <div class="flex flex-col items-center">
                <span class="mb-3 font-semibold text-gray-400 text-sm">右手 (左右轉向)</span>
                <div id="rightJoystick" class="joystick-container">
                    <div id="rightKnob" class="joystick-knob"></div>
                </div>
                <div class="mt-3 text-sm text-green-400 data-readout bg-black/40 px-3 py-1 rounded border border-gray-800" id="rightValDisplay">1500</div>
            </div>
        </div>

    </main>

    <!-- 歷程紀錄 Modal (預設隱藏) -->
    <div id="historyModal" class="fixed inset-0 bg-black/80 z-[10000] hidden flex items-center justify-center p-4">
        <div class="bg-[#121814] border border-[#233127] rounded-lg w-full max-w-lg flex flex-col max-h-[80vh] shadow-2xl shadow-green-900/20">
            <div class="flex justify-between items-center p-3 border-b border-[#233127]">
                <h3 class="text-green-400 font-bold tracking-wide">自動導航指令歷程</h3>
                <button id="btnCloseHistory" class="text-gray-400 hover:text-white text-2xl leading-none cursor-pointer">&times;</button>
            </div>
            <div class="p-3 overflow-y-auto flex-1 font-mono text-xs space-y-1 bg-black/50 min-h-[250px]" id="historyContent">
                <!-- 紀錄內容插入點 -->
            </div>
            <div class="p-3 border-t border-[#233127] flex justify-between items-center bg-black/30">
                <span class="text-xs text-gray-500" id="historyCount">共 0 筆紀錄</span>
                <button id="btnClearHistory" class="text-xs bg-red-900/30 border border-red-800 text-red-400 px-3 py-1.5 rounded hover:bg-red-900/60 transition cursor-pointer">清除紀錄</button>
            </div>
        </div>
    </div>

    <script>
        // --- 藍牙變數設定 ---
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_RX_UUID      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
        let bluetoothDevice = null;
        let rxCharacteristic = null;
        let isConnected = false;
        let sendInterval = null;
        let bleWriteBusy = false;
        let blePendingCommand = null;
        let bleWriteFailures = 0;

        // --- 控制變數 ---
        let steeringVal = 1500; // CH1: 方向 (右手左右)
        let throttleVal = 1500; // CH2: 油門 (左手上下)
        let ch3Val = 1500;      // 預留
        let ch4Val = 1500;      // 預留

        // --- 自動控制變數 ---
        let autoMode = false;
        let routePoints = [];
        let currentRouteIndex = 0;
        let routeCompleted = false;
        let targetPoint = null;
        let carScreenPos = null;
        let carMissingFrames = 0;
        const WAYPOINT_REACHED_PX = 40;

        // --- ArUco / 視覺短暫遺失時的自動搜尋 ---
        let visualLostSince = 0;
        let recoveryActive = false;
        let recoveryStartedAt = 0;
        let recoveryNextStepAt = 0;
        let recoveryLastAction = -1;
        const RECOVERY_GRACE_MS = 250;
        const RECOVERY_STEP_MS = 420;
        const NAV_SHARP_TURN_THROTTLE = 1570;

        // --- 有辨識到車但沒有實際位移時的防卡脫困 ---
        let stallAnchor = null;
        let stallBoostUntil = 0;
        let stallCooldownUntil = 0;
        let stallBoostCount = 0;
        let stallBoostSteer = 1500;
        const STALL_CHECK_MS = 1200;
        const STALL_MIN_MOVE_PX = 9;
        const STALL_MIN_PROGRESS_PX = 6;
        const STALL_BOOST_MS = 700;
        const STALL_COOLDOWN_MS = 900;
        const BOTH_HEADING_MAX_DIFF_DEG = 65;

        // --- 視覺辨識模式與 LED 方向追蹤 ---
        // both = ArUco 位置 + LED 方向（任一遺失時自動退回另一來源）
        // aruco = 僅使用 ArUco；led = 僅使用 LED 5x5 圖形
        let visionMode = 'aruco';
        let lastLedPose = null;
        const LED_SMOOTH_ALPHA = 0.35;

        // --- 新版 LED 辨識：針對 micro:bit 掃描顯示做時間融合 ---
        // 新圖案：
        // . . # . .   (車頭小團塊，共 4 顆)
        // . # # # .
        // . . . . .   (刻意空一列)
        // # # # # #   (車尾大團塊，共 10 顆)
        // # # # # #
        // 手機 rolling shutter 常只拍到其中幾列，因此將最近約 0.22 秒的紅色 LED 做時間殘影融合。
        let ledTemporalStrength = null;
        let ledTemporalW = 0, ledTemporalH = 0;
        let ledTemporalLastTime = 0;
        let ledTemporalAnchorX = null, ledTemporalAnchorY = null;
        let ledLastRawPose = null;
        let ledLastRawTime = 0;
        const LED_TEMPORAL_MEMORY_MS = 220;
        const LED_TEMPORAL_THRESHOLD = 48;
        const LED_POSE_HOLD_MS = 420;
        const LED_ARUCO_ROI_RADIUS_MARKERS = 3.2;
        const LED_ARUCO_MAX_CACHE_SHIFT_MARKERS = 1.4;
        const LED_LASTPOSE_ROI_PX = 110;
        const LED_HEADING_CONTINUITY_DEG = 80;

        // --- 新版 LED 車體座標鎖定追蹤 ---
        // micro:bit LED 與 ArUco 固定在同一台車上；ArUco 可見時不再讓紅光自行決定全域位置/方向。
        // 依實際安裝照片，LED 矩陣中心約在 ArUco 中心前方 1.62 個 marker 邊長。
        let ledLastReliablePose = null;
        let ledLastReliableTime = 0;
        let ledLastGuide = null;
        let ledLastGuideTime = 0;
        let ledPresenceEma = 0;
        const LED_MOUNT_FORWARD_MARKERS = 1.62;
        const LED_MOUNT_SIDE_MARKERS = 0.03;
        const LED_BOX_BACK_MARKERS = 0.72;
        const LED_BOX_FRONT_MARKERS = 0.82;
        const LED_BOX_HALF_WIDTH_MARKERS = 0.58;
        const LED_GUIDE_HOLD_MS = 550;
        const LED_RELIABLE_HOLD_MS = 500;
        const LED_TRACK_AFTER_GUIDE_MS = 850;

        // --- 歷程紀錄變數 ---
        let commandHistory = [];
        let isRecording = false;
        let lastRecordedCmd = "";

        // --- DOM Elements ---
        const $ = id => document.getElementById(id);
        const connectBtn = $('connectBtn');
        const btStatus = $('btStatus');
        const debugString = $('debugString');
        const modeDisplay = $('modeDisplay');
        const btnAutoStart = $('btnAutoStart');
        const btnAutoStop = $('btnAutoStop');
        const btnAutoScanRoute = $('btnAutoScanRoute');
        const btnAutoStartOverlay = $('btnAutoStartOverlay');
        const btnAutoStopOverlay = $('btnAutoStopOverlay');
        const targetStatus = $('targetStatus');
        const stageContainer = $('stageContainer');
        const btnUndoWaypoint = $('btnUndoWaypoint');
        const btnClearRoute = $('btnClearRoute');
        const btnVisionBoth = $('btnVisionBoth');
        const btnVisionAruco = $('btnVisionAruco');
        const btnVisionLed = $('btnVisionLed');
        const visionModeStatus = $('visionModeStatus');
        const ledStatus = $('ledStatus');
        const ledAngle = $('ledAngle');
        const recoveryThrottle = $('recoveryThrottle');
        const recoverySteer = $('recoverySteer');
        const recoveryTime = $('recoveryTime');
        const recoveryThrottleOut = $('recoveryThrottleOut');
        const recoverySteerOut = $('recoverySteerOut');
        const recoveryTimeOut = $('recoveryTimeOut');

        function updateRecoverySliderReadouts() {
            recoveryThrottleOut.textContent = recoveryThrottle.value;
            recoverySteerOut.textContent = `±${recoverySteer.value}`;
            recoveryTimeOut.textContent = `${Number(recoveryTime.value).toFixed(1)}s`;
        }
        [recoveryThrottle,recoverySteer,recoveryTime].forEach(el=>el.addEventListener('input',updateRecoverySliderReadouts));
        updateRecoverySliderReadouts();
        function getRecoverySettings() {
            return {
                throttle: Math.max(1510,Math.min(1700,Number(recoveryThrottle.value)||1570)),
                steerAmp: Math.max(20,Math.min(350,Number(recoverySteer.value)||120)),
                maxMs: Math.max(1000,Math.min(15000,(Number(recoveryTime.value)||4.5)*1000))
            };
        }

        function setVisionMode(mode) {
            visionMode = mode;
            lastLedPose = null;
            resetLedTemporalMemory();
            carMissingFrames = 0;
            resetVisualRecovery(false);

            const inactive = 'vision-mode-btn bg-gray-900 border border-gray-700 text-gray-400 py-1.5 px-2 rounded text-xs font-medium transition hover:border-gray-500';
            btnVisionBoth.className = inactive;
            btnVisionAruco.className = inactive;
            btnVisionLed.className = inactive;

            if(mode === 'both') {
                btnVisionBoth.className = 'vision-mode-btn bg-cyan-600/25 border border-cyan-400 text-cyan-300 py-1.5 px-2 rounded text-xs font-medium transition';
                visionModeStatus.textContent = 'ArUco + LED';
                visionModeStatus.className = 'text-cyan-300 data-readout';
            } else if(mode === 'aruco') {
                btnVisionAruco.className = 'vision-mode-btn bg-green-600/20 border border-green-500 text-green-300 py-1.5 px-2 rounded text-xs font-medium transition';
                visionModeStatus.textContent = '僅 ArUco';
                visionModeStatus.className = 'text-green-300 data-readout';
                ledStatus.textContent = '已停用';
                ledStatus.className = 'text-gray-500';
                ledAngle.textContent = '—';
            } else {
                btnVisionLed.className = 'vision-mode-btn bg-red-600/20 border border-red-500 text-red-300 py-1.5 px-2 rounded text-xs font-medium transition';
                visionModeStatus.textContent = '僅 LED';
                visionModeStatus.className = 'text-red-300 data-readout';
            }
        }

        btnVisionBoth.addEventListener('click', () => setVisionMode('both'));
        btnVisionAruco.addEventListener('click', () => setVisionMode('aruco'));
        btnVisionLed.addEventListener('click', () => setVisionMode('led'));

        // 預設辨識方式：僅 ArUco。使用者仍可手動切換到其他模式。
        setVisionMode('aruco');
        setRouteButtonState();

        // ==========================================
        // 全螢幕切換邏輯

        async function connectDevice() {

                });
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                btStatus.textContent = "連線中...";
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(UART_RX_UUID);
                
                isConnected = true;

        function disconnectDevice() {

        function onDisconnected() {
            isConnected = false;

        function formatCommand() {
            const pad = (num) => Math.max(1000, Math.min(2000, Math.round(num))).toString().padStart(4, '0');
            return `SRV${pad(steeringVal)}${pad(throttleVal)}${pad(ch3Val)}${pad(ch4Val)}#`;
        }

        function queueBleCommand(command) {
            if (!isConnected || !rxCharacteristic) return;
            blePendingCommand = command;
            if (!bleWriteBusy) flushBleCommandQueue();
        }

        async function flushBleCommandQueue() {
            if (bleWriteBusy) return;
            bleWriteBusy = true;
            const encoder = new TextEncoder('utf-8');
            try {
                while (blePendingCommand && isConnected && rxCharacteristic) {
                    const command = blePendingCommand;
                    blePendingCommand = null;
                    try {
                        await rxCharacteristic.writeValueWithoutResponse(encoder.encode(command));
                        bleWriteFailures = 0;
                    } catch (e) {
                        bleWriteFailures++;
                        console.warn('BLE UART write failed', e);
                        break;
                    }
                }
            } finally {
                bleWriteBusy = false;
                if (blePendingCommand && isConnected && rxCharacteristic) Promise.resolve().then(flushBleCommandQueue);
            }
        }

        function sendDataToMicrobit() {
            const command = formatCommand();
            debugString.textContent = command;
            if (isRecording && command !== lastRecordedCmd) {
                const now = new Date();
                const ms = now.getMilliseconds().toString().padStart(3,'0');
                const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}.${ms}`;
                commandHistory.push({time:timeStr,cmd:command});
                lastRecordedCmd = command;
            }
            queueBleCommand(command);
        }

        function startSendingData() {
            if (sendInterval) clearInterval(sendInterval);
            sendDataToMicrobit();

        }

        // ==========================================

        function setupJoystick(containerId, knobId, axis, callback) {
            const container = $(containerId), knob = $(knobId);
            let isDragging = false;
            let activeTouchId = null;

            function updateKnobPosition(clientX, clientY) {
                if (autoMode) return; // 自動模式下忽略搖桿
                const rect = container.getBoundingClientRect();
                const maxRadius = (container.offsetWidth - knob.offsetWidth) / 2;
                const centerX = container.offsetWidth / 2, centerY = container.offsetHeight / 2;
                let dx = clientX - rect.left - centerX;
                let dy = clientY - rect.top - centerY;

                if (axis === 'y') dx = 0; else if (axis === 'x') dy = 0;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > maxRadius) { dx *= maxRadius/dist; dy *= maxRadius/dist; }
                
                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                let val = 1500;
                if (axis === 'y') val = 1500 - (dy / maxRadius) * 500;
                else if (axis === 'x') val = 1500 + (dx / maxRadius) * 500;
                callback(val);
            }

            function resetKnob() {
                if (autoMode) return;
                knob.style.transform = `translate(-50%, -50%)`;
                callback(1500);
            }

            // Mouse
            knob.addEventListener('mousedown', (e) => { if(!autoMode){isDragging = true; e.preventDefault();} });
            document.addEventListener('mousemove', (e) => { if (isDragging) updateKnobPosition(e.clientX, e.clientY); });
            document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; resetKnob(); } });

            // Touch
            container.addEventListener('touchstart', e => {
                if(autoMode) return;
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    const target = document.elementFromPoint(t.clientX, t.clientY);
                    if (target === container || target === knob || activeTouchId === t.identifier) {
                        activeTouchId = t.identifier;
                        updateKnobPosition(t.clientX, t.clientY);
                    }
                }
            }, {passive: false});
            
            container.addEventListener('touchmove', e => {
                if(autoMode) return;
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) updateKnobPosition(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                }
            }, {passive: false});

            const handleEnd = e => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        activeTouchId = null;
                        resetKnob();
                    }
                }
            };
            container.addEventListener('touchend', handleEnd);
            container.addEventListener('touchcancel', handleEnd);
        }

        const DICT = ["1010001011011001010111100", "0000111000000011011100110", "1101011110000111011011101", "1000000111001010111110111", "1101011101011010100100100", "1110101000000100000101101", "0110100111101011111101100", "0111000100001010001101011", "1000011010110000100110010", "1001100010011111110100101", "1001111001110111000000011", "1101000101101101011000000", "1111001100010101100010001", "0010111100111000101100110", "1111111001111110010101000", "0010100011110001101111111", "0100101111010011101011000", "0101111101010001001101111", "0111101100100110111000100", "1000001100001110111101000", "1001011011101101001110101", "1010100001110010001000000", "1011010110000110010100001", "0101110100001001011011110", "1100111001101000000100011", "1101001011001100101110010", "1110000111100111010001011", "0001000100100001001000110", "0001110111001011001110010", "0001001000010001000111011", "0001001110011011101101110", "0001101101000100001110011", "0010000001101000011001110", "0010010101010101011001000", "0010001100100001110111010", "0011110100110111111101010", "0100110011000101010101100", "0100000101101000100000001", "0100110101010110100011101", "0100001100011110001110010", "0101011010010100000100101", "0101001010010111110011110", "0110110000100100111110111", "0110000110000100111011001", "0110110100111111000110001", "0111010010110001001111010", "0111010011011100110010111", "0111110010100100000000110", "0111101011001000100100101", "0111101101011011111010111"];
        const MAX_ERR_BITS = 2;
        
        function rot90(s){ let o=''; for(let c=0;c<5;c++) for(let r=4;r>=0;r--) o+=s[r*5+c]; return o; }
        function hamming(a,b){ let d=0; for(let i=0;i<25;i++) if(a[i]!==b[i]) d++; return d; }
        function matchDict(bits){
            let best=null, cur=bits;
            for(let k=0;k<4;k++){
                for(let id=0;id<DICT.length;id++){
                    const d=hamming(cur,DICT[id]);
                    if(d<=MAX_ERR_BITS && (!best||d<best.dist)) best={id,rot:k,dist:d};
                }
                cur=rot90(cur);
            }
            return best;
        }
